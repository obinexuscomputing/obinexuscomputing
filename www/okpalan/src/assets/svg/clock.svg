<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Proper Time Clock -->
  <g transform="translate(150, 150)">
    <!-- Clock Face -->
    <circle cx="0" cy="0" r="100" fill="white" stroke="black" stroke-width="2"/>
    <!-- Hour Marks -->
    <g id="properHourMarks">
      <line x1="0" y1="-90" x2="0" y2="-100" stroke="black" stroke-width="2"/>
      <line x1="90" y1="0" x2="100" y2="0" stroke="black" stroke-width="2"/>
      <line x1="0" y1="90" x2="0" y2="100" stroke="black" stroke-width="2"/>
      <line x1="-90" y1="0" x2="-100" y2="0" stroke="black" stroke-width="2"/>
    </g>
    <!-- Clock Hands -->
    <line id="properHourHand" x1="0" y1="0" x2="0" y2="-50" stroke="black" stroke-width="3"/>
    <line id="properMinuteHand" x1="0" y1="0" x2="0" y2="-70" stroke="black" stroke-width="2"/>
    <line id="properSecondHand" x1="0" y1="0" x2="0" y2="-80" stroke="red" stroke-width="1"/>
    <!-- Center Point -->
    <circle cx="0" cy="0" r="5" fill="black"/>
    <!-- Label -->
    <text x="0" y="130" text-anchor="middle" font-size="16">Proper Time</text>
  </g>

  <!-- Dilated Time Clock -->
  <g transform="translate(450, 150)">
    <!-- Clock Face -->
    <circle cx="0" cy="0" r="100" fill="#f0f0f0" stroke="blue" stroke-width="2"/>
    <!-- Hour Marks -->
    <g id="dilatedHourMarks">
      <line x1="0" y1="-90" x2="0" y2="-100" stroke="blue" stroke-width="2"/>
      <line x1="90" y1="0" x2="100" y2="0" stroke="blue" stroke-width="2"/>
      <line x1="0" y1="90" x2="0" y2="100" stroke="blue" stroke-width="2"/>
      <line x1="-90" y1="0" x2="-100" y2="0" stroke="blue" stroke-width="2"/>
    </g>
    <!-- Clock Hands -->
    <line id="dilatedHourHand" x1="0" y1="0" x2="0" y2="-50" stroke="blue" stroke-width="3"/>
    <line id="dilatedMinuteHand" x1="0" y1="0" x2="0" y2="-70" stroke="blue" stroke-width="2"/>
    <line id="dilatedSecondHand" x1="0" y1="0" x2="0" y2="-80" stroke="red" stroke-width="1"/>
    <!-- Center Point -->
    <circle cx="0" cy="0" r="5" fill="blue"/>
    <!-- Label -->
    <text x="0" y="130" text-anchor="middle" font-size="16">Dilated Time</text>
  </g>
</svg>