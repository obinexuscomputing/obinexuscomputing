<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive visualization of the Collatz conjecture sequence with multiple viewing modes">
    <title>Collatz Sequence Visualization</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="container collatz">
        <header class="header">
            <nav class="nav-header" aria-label="Main navigation">
                <a href="/index.html" class="back-link" aria-label="Back to home page">
                    <img src="/assets/home-icon.svg" alt="" class="home-icon" width="24" height="24">
                    <span>Home</span>
                </a>
                <h1>Collatz Sequence Visualization</h1>
            </nav>
        </header>

        <div class="control-panel" role="toolbar" aria-label="Visualization controls">
            <div class="input-section">
                <div class="input-group">
                    <label for="startNumber">Starting Number:</label>
                    <input 
                        type="number" 
                        id="startNumber" 
                        min="1" 
                        value="27" 
                        class="number-input"
                        aria-label="Enter starting number"
                        required>
                </div>
                <button 
                    id="calculateBtn" 
                    class="btn btn-primary"
                    aria-label="Calculate sequence">
                    Calculate
                </button>
            </div>
            
            <div class="view-controls">
                <label for="viewMode">View Mode:</label>
                <select 
                    id="viewMode" 
                    class="select-input"
                    aria-label="Select visualization mode">
                    <option value="trajectory">Trajectory</option>
                    <option value="parity">Parity Analysis</option>
                    <option value="quantum">Quantum States</option>
                    <option value="energy">Energy Levels</option>
                </select>
            </div>
        </div>

        <main class="visualization-container">
            <div 
                id="chart" 
                class="chart-container"
                role="img" 
                aria-label="Collatz sequence visualization">
            </div>
            
            <div class="stats-grid" role="region" aria-label="Sequence statistics">
                <div class="stat-card">
                    <h3>Steps</h3>
                    <span id="stepCount" class="stat-value" aria-live="polite">0</span>
                </div>
                <div class="stat-card">
                    <h3>Max Value</h3>
                    <span id="maxValue" class="stat-value" aria-live="polite">0</span>
                </div>
                <div class="stat-card">
                    <h3>Even Steps</h3>
                    <span id="evenCount" class="stat-value" aria-live="polite">0</span>
                </div>
                <div class="stat-card">
                    <h3>Odd Steps</h3>
                    <span id="oddCount" class="stat-value" aria-live="polite">0</span>
                </div>
            </div>
        </main>

        <div 
            id="loading" 
            class="loading-overlay" 
            role="alert" 
            aria-busy="true" 
            aria-label="Loading visualization">
            <div class="spinner" aria-hidden="true"></div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Load D3.js with fallback -->
    <script>
        window.addEventListener('error', function(e) {
            if (e.target.src && e.target.src.includes('d3js.org')) {
                var fallbackScript = document.createElement('script');
                fallbackScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js';
                document.body.appendChild(fallbackScript);
            }
        }, true);
    </script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/js/collatz.js" defer></script>
    <script src="/js/main.js" defer></script>
</body>
</html>
